                }
              }
            }
          },
          "429": {
            "description": "请求被拒；按错误码处理，不重试权限撤回或数据删除。",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "503": {
            "description": "请求被拒；按错误码处理，不重试权限撤回或数据删除。",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          }
        }
      }
    },
    "/v1/sessions/{session_id}/finalize": {
      "post": {
        "operationId": "finalizeSession",
        "summary": "确认完整事件后服务端判分并结束会话",
        "description": "last_seq 必须为 session_ended，原因须与末事件一致。序号 1..last_seq 缺失返回 MISSING_EVENTS 及范围；超出 last_seq 的已存在事件返回 EVENT_CONFLICT。成功后不再接受新事件，只接受内容一致的重复请求。零事件放弃使用未来的 abandon 接口，此接口至少一个结束事件。结果计数与每个指标分母由服务端重算。",
        "parameters": [
          {
            "name": "session_id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          },
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "minLength": 16,
              "maxLength": 128
            },
            "description": "绑定主体、路径与规范化请求内容；同键不同内容返回 409。会话保留期间维持结果去重；每次重放先检查撤销/删除。"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/FinalizeSession"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "成功",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Result"
                }
              }
            }
          },
          "400": {
            "description": "请求被拒；按错误码处理，不重试权限撤回或数据删除。",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "401": {
            "description": "请求被拒；按错误码处理，不重试权限撤回或数据删除。",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "403": {
            "description": "请求被拒；按错误码处理，不重试权限撤回或数据删除。",
            "content": {
