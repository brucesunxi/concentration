    "/v1/sessions/{session_id}/events": {
      "post": {
        "operationId": "appendEvents",
        "summary": "提交至多 100 个事件；请求正文至多 256 KiB",
        "description": "原子校验整个批次；任何冲突或非法事件均拒绝整批。允许乱序到达，返回连续接收水位。event_id、seq 均须在会话内唯一；完全一致的重传进入 duplicate_ids。服务端校验计划刺激、有效状态机、时间单调和版本，禁止把客户端分数作为事实。",
        "parameters": [
          {
            "name": "session_id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          },
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "minLength": 16,
              "maxLength": 128
            },
            "description": "绑定主体、路径与规范化请求内容；同键不同内容返回 409。会话保留期间维持结果去重；每次重放先检查撤销/删除。"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/EventBatch"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "成功",
            "content": {
