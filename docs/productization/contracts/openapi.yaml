{
  "openapi": "3.1.0",
  "info": {
    "title": "Focus Family 核心训练接口草案",
    "version": "0.1.0-design",
    "description": "设计评审契约，尚未实现。只覆盖已完成身份与监护同意后的会话和事件；开户、同意、支付、删除由技术设计另行规定。批次原子接受或拒绝；身份/撤销/删除检查先于幂等回放。不得凭此文件宣称已有生产后端。"
  },
  "servers": [
    {
      "url": "https://api.example.invalid",
      "description": "占位域名，不提供服务"
    }
  ],
  "security": [
    {
      "ChildSessionToken": []
    }
  ],
  "paths": {
    "/v1/children/{child_id}/sessions": {
      "post": {
        "operationId": "createSession",
        "summary": "创建一个版本固定的训练或批准的测量会话",
        "description": "验证儿童作用域令牌、地区、年龄、同意、内容许可和课程版本；measurement 还需服务端已有测量安排。设备存在有效租约时返回 SESSION_CONFLICT。",
        "parameters": [
          {
            "name": "child_id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          },
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "minLength": 16,
              "maxLength": 128
            },
            "description": "绑定主体、路径与规范化请求内容；同键不同内容返回 409。会话保留期间维持结果去重；每次重放先检查撤销/删除。"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/CreateSession"
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "成功",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Session"
                }
              }
            }
          },
          "400": {
            "description": "请求被拒；按错误码处理，不重试权限撤回或数据删除。",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "401": {
            "description": "请求被拒；按错误码处理，不重试权限撤回或数据删除。",
