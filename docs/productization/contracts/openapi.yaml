                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "409": {
            "description": "请求被拒；按错误码处理，不重试权限撤回或数据删除。",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "410": {
            "description": "请求被拒；按错误码处理，不重试权限撤回或数据删除。",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "413": {
            "description": "请求被拒；按错误码处理，不重试权限撤回或数据删除。",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "422": {
            "description": "请求被拒；按错误码处理，不重试权限撤回或数据删除。",
            "content": {
