name: Android test packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - name: Check native contracts
        run: npm run mobile:check
      - name: Record exact mobile source
        run: node scripts/snapshot-mobile-source.mjs dist/mobile-native/android-aab/source-snapshot.json
      - name: Generate Android project
        run: node scripts/mobile.mjs prebuild --platform android --clean --no-install
      - name: Build local test packages
        working-directory: apps/family-mobile/android
        run: bash ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon --max-workers=2
      - name: Preserve packages
        run: |
          cp apps/family-mobile/android/app/build/outputs/bundle/release/app-release.aab \
            dist/mobile-native/android-aab/FocusIslandDev-local.aab
          cp apps/family-mobile/android/app/build/outputs/apk/release/app-release.apk \
            dist/mobile-native/android-aab/FocusIslandDev-local.apk
      - name: Verify bundle and source
        run: |
          node scripts/verify-android-aab.mjs \
            --aab dist/mobile-native/android-aab/FocusIslandDev-local.aab \
            --snapshot dist/mobile-native/android-aab/source-snapshot.json \
            --source-ref "$GITHUB_SHA" --java-home "$JAVA_HOME" \
            --output dist/mobile-native/android-aab/aab-static-report.json
      - name: Verify installable APK and source
        run: |
          ANDROID_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$ANDROID_TOOLS/aapt2" && test -x "$ANDROID_TOOLS/apksigner"
          node scripts/verify-android-local-artifact.mjs \
            --apk dist/mobile-native/android-aab/FocusIslandDev-local.apk \
            --snapshot dist/mobile-native/android-aab/source-snapshot.json \
            --source-ref "$GITHUB_SHA" --android-tools "$ANDROID_TOOLS" \
            --aab-report dist/mobile-native/android-aab/aab-static-report.json \
            --output dist/mobile-native/android-aab/apk-static-report.json
      - uses: actions/upload-artifact@v7
        with:
          name: focus-island-android-aab-${{ github.sha }}
          path: |
            dist/mobile-native/android-aab/FocusIslandDev-local.aab
            dist/mobile-native/android-aab/FocusIslandDev-local.apk
            dist/mobile-native/android-aab/source-snapshot.json
            dist/mobile-native/android-aab/aab-static-report.json
            dist/mobile-native/android-aab/apk-static-report.json
          if-no-files-found: error
          retention-days: 14
