name: Family quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  family-flow:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/qa/requirements.txt
      - run: npm ci
      - run: python -m pip install -r scripts/qa/requirements.txt
      - name: Install audio validation tool
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Check runner browser
        run: test -x /usr/bin/google-chrome
      - name: Check contracts, clients and service
        run: |
          npm run check
          npm run mobile:check
          npm test
          npm run test:http
      - name: Exercise the family browser flow
        run: npm run test:browser
        env:
          FOCUS_BROWSER_PYTHON: python
          FOCUS_BROWSER_PATH: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: family-browser-failure
          path: dist/browser-qa/failure.png
          if-no-files-found: ignore
